# .github/workflows/release.yml
# 作用：推送 main 分支（或手动触发）时，读取 package.json 的版本号，
#       若该版本对应的 tag 尚不存在，则自动打 tag，并在 GitHub 上打包、发布 Release。
# 流程：prepare（判断版本号 + 自动打 tag）→ build（Vite 构建 + electron-builder 打包）→ release（上传 GitHub Release）。
# 用法：修改 package.json 的 version 后推送 main 分支即可，无需手动打 tag；版本号未变化时自动跳过。

name: Build and Release

on:
  push:
    branches:
      - main          # 推送 main 分支时触发（版本号未变化则自动跳过）
  workflow_dispatch:  # 也可在 Actions 页面手动触发

jobs:
  # ---------------- 任务零：判断版本号是否变化，必要时自动打 tag ----------------
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要自动创建并推送 tag
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should_release: ${{ steps.check-tag.outputs.should_release }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取 package.json 版本号
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 检查该版本 tag 是否已存在
        id: check-tag
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag v${VERSION} 已存在，版本未变化，跳过发布"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "新版本 v${VERSION}，将自动发布"
          fi

      - name: 自动创建并推送 tag
        if: steps.check-tag.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "已自动创建并推送 tag v${VERSION}"

  # ---------------- 任务一：跨平台打包 ----------------
  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 一个平台失败不阻断其他平台
      matrix:
        # 只需某个平台时删掉其余行即可（如只打包 Windows 只留 windows-latest）
        os:
          - windows-latest   # 产出 NSIS 安装包 .exe
          #- macos-latest     # 产出 .dmg / .zip
          #- ubuntu-latest    # 产出 AppImage / .deb

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   # 命中 package-lock.json 的依赖缓存，加快安装

      - name: 安装依赖
        run: npm ci    # 按 package-lock.json 精确安装

      - name: 构建前端
        run: npm run build   # vite build → dist/

      - name: electron-builder 打包
        run: npx electron-builder --publish never
        env:
          # 未配置代码签名证书时跳过签名，避免 mac / win 打包失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  # ---------------- 任务二：汇总产物并发布 Release ----------------
  release:
    name: Publish Release
    needs: [prepare, build]  # 等打包完成再发布
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写 Release 的权限

    steps:
      - name: 下载所有安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}   # 由 prepare 读出的版本号生成
          generate_release_notes: true   # 自动生成变更说明
          # skip-if-release-exists: true    # tag 已存在时跳过，避免手动重复触发报错
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
